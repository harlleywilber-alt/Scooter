# Nome fixo do projeto: mantém o volume "scooter_postgres_data" com os dados do banco
name: scooter

services:
  postgres:
    image: postgres:16
    container_name: escooter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: escooter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: